; ============================================================
; PDF制作工具 - 配置文件
; ============================================================
; 使用说明：
;   1. 根据你的需求修改各项参数
;   2. 运行主脚本: python pdf_maker.py
;   3. 脚本会自动按顺序执行所有步骤
; ============================================================

[步骤控制]
; 是否执行各个步骤 (true/false)
; 可以根据需要开启/关闭特定步骤
执行_生成背景 = true
执行_添加背景 = true
执行_两两拼接 = true
执行_设置DPI = true
执行_合并PDF = true

[路径设置]
; 所有路径支持相对路径和绝对路径
; 输入文件夹: 存放原始JPG图片的文件夹
输入文件夹 = ./images

; 输出文件夹: 处理过程中间文件存放位置
输出文件夹 = ./output

; 背景图文件名 (保存在输出文件夹中)
背景图文件名 = 背景.png

; 最终PDF文件名 (保存在输出文件夹中)
PDF文件名 = output.pdf

[背景图参数]
; 生成背景图的尺寸 (单位: mm)
; A4竖版: 210 x 297
; A4横版: 297 x 210
; A5竖版: 148 x 210
; A5横版: 210 x 148
宽度_mm = 210
高度_mm = 297/2

; DPI (建议300)
DPI = 300

[添加背景参数]
; 图片叠加在背景上的偏移量 (单位: 像素)
; gravity = north 表示从顶部开始
; offset_x: 水平偏移 (正数向右)
; offset_y: 垂直偏移 (正数向下)
偏移_X = 0
偏移_Y = 0

[拼接参数]
; 是否将图片两两纵向拼接
; 如果开启，输入文件夹的图片会按文件名排序后两两配对
拼接_启用 = true

; 拼接后是否删除原始文件
拼接_删除原始 = false

[PDF参数]
; JPEG压缩质量 (1-100)
; 值越高画质越好，文件越大
PDF_质量 = 80

[DPI设置参数]
; 设置图片DPI (建议与背景图DPI一致)
DPI_设置值 = 300